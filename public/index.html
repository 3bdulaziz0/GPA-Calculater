<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">

    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />
    
    <link rel="stylesheet" href="style.css">
    
     <link rel="icon" href="icon.png" type="image/png">

</head>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>


<body>


    <div class="container1">

        <div class="header mb-4 prevent-select">
            <a href="/" class="px-5" style="color: inherit; text-decoration: none; width: 10%;">
                <h1 style="font-size: 7rem;" onclick="setupUI();">Σ</h1>
            </a>
        </div>

        <div class="base" data-bs-theme="">
            <div class="cards" id="cards">
                <div class="card">
                    <div class="card-header">
                        المعدل التراكمي
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <label class="form-check-label col-5" for="previous-credits" >الساعات السابقة</label>
                            <input class="my-3 col-2 " inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, ''); prev();" type="text" name="previous-credits" id="previous-credits">
                        </li>

                        <br>

                        <li class="list-group-item">

                            <div class="form-check" style="padding: 0px;">
                                <input class="form-check-input float-none mx-2 mb-4 " checked type="radio" name="radio-previous" id="radio-GPA">
                                <label class="form-check-label mb-3 col-4" for="radio-GPA">
                                    المعدل التراكمي السابق
                                </label>
                                
                                <input type="text" class="" inputmode="decimal" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1'); prev();" name="inp-GPA" id="inp-GPA">
                            </div>

                            <br>

                            <div class="form-check" style="padding: 0px;">
                                <input class="form-check-input float-none mx-2 mb-4 " type="radio" name="radio-previous" id="radio-points">
                                <label class="form-check-label mb-3 col-4" for="radio-points">
                                    النقاط (دقة 100%)
                                </label>
                                <input type="text" class="" inputmode="decimal" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1'); prev();" disabled name="inp-points" id="inp-points">
                            </div>
                            <br>    
                            
                        </li>
                    </ul>
                </div>

                <div class="card">
                    <div class="card-header">
                        نظام المعدل
                    </div>
                    <ul class="list-group list-group-flush mt-3">

                        <li class="list-group-item">

                            <div class="form-check scale">
                                <input class="form-check-input" checked type="radio" name="radio-system" value="5" id="radio-system5">
                                <label class="form-check-label" for="radio-system5" style="width: 100%;">
                                    5
                                </label>
                            </div>

                            <hr>
                            

                            <div class="form-check scale">
                                <input class="form-check-input" type="radio" name="radio-system" value="4" id="radio-system4">
                                <label class="form-check-label" for="radio-system4" style="width: 100%;">
                                    4
                                </label>
                            </div> 

                            <hr>
                            
                            <div class="form-check scale">
                                <input class="form-check-input" type="radio" name="radio-system" value="100" id="radio-system100">
                                <label class="form-check-label" for="radio-system100" style="width: 100%;">
                                    100
                                </label>
                            </div>

                            <hr>
                            
                        </li>
                    </ul>
                </div>
                

            </div>

            <div class="results">

                <div class="card results-table">
                    <div class="card-header results-content d-flex justify-content-between">
                        <span id="results-header">نتائج الفصل</span>
                        <span class="form-check form-switch" style="float: left;">
                                <!-- اذا اشتغل  .. التراكمي -->
                                <input class="form-check-input" type="checkbox" role="switch" id="cumulative"> 
                        </span>
                    </div>
                    <ul class="list-group list-group-flush results-content">
                        <li class="list-group-item my-2">النقاط <span class="result-N" id="result-P">0</span></li>
                        <li class="list-group-item my-2">الساعات <span class="result-N" id="result-C">0</span></li>
                        <li class="list-group-item my-2">المعدل <span class="result-N" id="result-GPA">0</span></li>
                        <li class="list-group-item my-2">التقدير <span class="result-N" id="result-G">0</span></li>
                    </ul>
                </div>

            </div>
            
            
        </div>

        <br> <br> <br>

        <div class="table-responsive courses-table" style="width: 100%; display: flex; justify-content: center;">
            <table class="table" style="width: 80%;">
                <tr class="table-head table-secondary">
                    <th class="name-column"><h6>اسم المقرر</h6></th>
                    <th class="score-column"><h6>الدرجة</h6></th>
                    <th class="credit-column"><h6>عدد الساعات</h6></th>
                    <th class="grade-column"><h6>التقدير</h6></th>
                    <th class="points-column"><h6>النقاط</h6></th>
                    <th class="delete-column" style="visibility: visible;"><h6></h6></th>
                </tr>
                <tbody id="courses">
                    <tr class="" id="course0" >
                        <td class="course name-column">
                            <input type="text" class="inp" id="course1-name">
                        </td>
                        <td class="course score-column">
                            <input type="text" class="inp" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1'); calc();" inputmode="decimal" id="course1-score">
                        </td>
                        <td class="course credit-column">
                            <input type="text" class="inp" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calc();" inputmode="numeric" id="course1-credit">
                        </td>
                        <td class="course grade-column">
                            <select id="course1-grades" onchange="document.getElementById('course1-score').value = getScore(this.selectedIndex); calc();"> 
                                <option value="-">-</option>
                                <option value="A+">A+</option>
                                <option value="A">A</option>
                                <option value="B+">B+</option>
                                <option value="B">B</option>
                                <option value="C+">C+</option>
                                <option value="C">C</option>
                                <option value="D+">D+</option>
                                <option value="D">D</option>
                                <option value="F">F</option>
                            </select>
                        </td>
                        <td class="course points-column">
                            <input type="text" class="inp" id="course1-points" disabled>
                        </td>
                        <td class="course delete-column">
                            <span class="material-symbols-outlined" style="display: flex; align-items: center; color: rgb(255, 2, 2);">
                                close
                            </span>
                        </td>
                    </tr>
                    <tr class="" id="course0">
                        <td class="course name-column">
                            <input type="text" class="inp" id="course1-name">
                        </td>
                        <td class="course score-column">
                            <input type="text" class="inp" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calc();" inputmode="numeric" id="course1-score">
                        </td>
                        <td class="course credit-column">
                            <input type="text" class="inp" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calc();" inputmode="numeric" id="course1-credit">
                        </td>
                        <td class="course grade-column">
                            <select id="course1-grades" onchange="document.getElementById('course1-score').value = getScore(this.selectedIndex); calc();"> 
                                <option value="-">-</option>
                                <option value="A+">A+</option>
                                <option value="A">A</option>
                                <option value="B+">B+</option>
                                <option value="B">B</option>
                                <option value="C+">C+</option>
                                <option value="C">C</option>
                                <option value="D+">D+</option>
                                <option value="D">D</option>
                                <option value="F">F</option>
                            </select>
                        </td>
                        <td class="course points-column">
                            <input type="text" class="inp" id="course1-points" disabled>
                        </td>
                        <td class="course delete-column">
                            <span class="material-symbols-outlined" style="display: flex; align-items: center; color: rgb(255, 2, 2);">
                                close
                            </span>

                        </td>
                    </tr>
                
                
                
                </tbody>
            </table>
        </div>
        <button type="button" class="btn btn-primary my-3" id="add-btn" onclick="addCourse()">اضافة مقرر</button>

        <br><br><br>

        
        
        
  



        <div id="T1">
                
        </div>



        
        <footer class="footer prevent-select"><span style="display: block; justify-content: center; align-items: center; padding: 1% 0;">By Abdulaziz - <a href="https://x.com/3ziz005" style="text-decoration: none; font-size: 1.25rem;">𝕏</a></span></footer>
    </div>


    
</body>

<script type="module" src="analytics.js"></script>

<script src="script.js"></script>
<script src="FCIT.js"></script>



</html>
